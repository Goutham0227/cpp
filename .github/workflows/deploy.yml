name: CI/CD Pipeline - Freelancer Time Tracking & Invoice Generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-1

jobs:
  # ───────────────────────────────────────────────
  # Job 1: Test the invoice_engine library
  # ───────────────────────────────────────────────
  test-library:
    name: Test Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library and run tests
        run: |
          cd library
          pip install -e .
          pip install pytest
          pytest tests/ -v

  # ───────────────────────────────────────────────
  # Job 2: Deploy backend (Lambda + DynamoDB + S3 + SNS + API Gateway)
  # ───────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: test-library
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── DynamoDB ──
      - name: Create DynamoDB table
        run: |
          aws dynamodb describe-table --table-name timetracker-prod --region ${{ env.AWS_REGION }} > /dev/null 2>&1 || \
          aws dynamodb create-table \
            --table-name timetracker-prod \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_REGION }}

      # ── S3 bucket for files ──
      - name: Create S3 bucket for files
        run: |
          aws s3api head-bucket --bucket timetracker-files-prod-goutham --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws s3api create-bucket \
            --bucket timetracker-files-prod-goutham \
            --region ${{ env.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}

      - name: Configure S3 CORS
        run: |
          aws s3api put-bucket-cors --bucket timetracker-files-prod-goutham --cors-configuration '{
            "CORSRules": [
              {
                "AllowedOrigins": ["*"],
                "AllowedMethods": ["GET", "PUT", "POST", "DELETE"],
                "AllowedHeaders": ["*"],
                "MaxAgeSeconds": 3600
              }
            ]
          }'

      # ── IAM role for Lambda ──
      - name: Create IAM role for Lambda
        run: |
          aws iam get-role --role-name timetracker-lambda-role > /dev/null 2>&1 || \
          aws iam create-role \
            --role-name timetracker-lambda-role \
            --assume-role-policy-document '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {"Service": "lambda.amazonaws.com"},
                  "Action": "sts:AssumeRole"
                }
              ]
            }'

      - name: Attach IAM policies
        run: |
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess || true
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonS3FullAccess || true
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonSNSFullAccess || true
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole || true

      # ── SNS topic ──
      - name: Create SNS topic
        run: |
          SNS_TOPIC_ARN=$(aws sns create-topic --name timetracker-notifications --region ${{ env.AWS_REGION }} --query 'TopicArn' --output text)
          echo "SNS_TOPIC_ARN=$SNS_TOPIC_ARN" >> $GITHUB_ENV

      # ── Wait for IAM propagation ──
      - name: Wait for IAM propagation
        run: sleep 10

      # ── Package Lambda ──
      - name: Package Lambda function
        run: |
          cd backend
          pip install -r requirements.txt -t .
          zip -r ../function.zip . -x "*.pyc" -x "__pycache__/*" -x "package/*"

      # ── Get IAM role ARN ──
      - name: Get Lambda role ARN
        run: |
          ROLE_ARN=$(aws iam get-role --role-name timetracker-lambda-role --query 'Role.Arn' --output text)
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

      # ── Deploy Lambda ──
      - name: Deploy Lambda function
        run: |
          if aws lambda get-function --function-name timetracker-api --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name timetracker-api \
              --zip-file fileb://function.zip \
              --region ${{ env.AWS_REGION }}
            aws lambda wait function-updated --function-name timetracker-api --region ${{ env.AWS_REGION }}
          else
            aws lambda create-function \
              --function-name timetracker-api \
              --runtime python3.11 \
              --handler lambda_function.lambda_handler \
              --role ${{ env.ROLE_ARN }} \
              --zip-file fileb://function.zip \
              --timeout 30 \
              --memory-size 256 \
              --region ${{ env.AWS_REGION }} \
              --environment Variables="{
                DYNAMODB_TABLE=timetracker-prod,
                S3_BUCKET=timetracker-files-prod-goutham,
                SNS_TOPIC_ARN=${{ env.SNS_TOPIC_ARN }},
                REGION=eu-west-1,
                JWT_SECRET=timetracker-secret-2026
              }"
          fi

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name timetracker-api \
            --environment Variables="{
              DYNAMODB_TABLE=timetracker-prod,
              S3_BUCKET=timetracker-files-prod-goutham,
              SNS_TOPIC_ARN=${{ env.SNS_TOPIC_ARN }},
              REGION=eu-west-1,
              JWT_SECRET=timetracker-secret-2026
            }" \
            --region ${{ env.AWS_REGION }} || true

      # ── API Gateway ──
      - name: Create or get API Gateway
        run: |
          API_ID=$(aws apigatewayv2 get-apis --region ${{ env.AWS_REGION }} \
            --query "Items[?Name=='timetracker-api'].ApiId" --output text)

          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            API_ID=$(aws apigatewayv2 create-api \
              --name timetracker-api \
              --protocol-type HTTP \
              --cors-configuration AllowOrigins="*",AllowMethods="GET,POST,PUT,DELETE,OPTIONS",AllowHeaders="Content-Type,Authorization" \
              --region ${{ env.AWS_REGION }} \
              --query 'ApiId' --output text)
          fi
          echo "API_ID=$API_ID" >> $GITHUB_ENV

      - name: Get Lambda ARN
        run: |
          LAMBDA_ARN=$(aws lambda get-function --function-name timetracker-api \
            --region ${{ env.AWS_REGION }} --query 'Configuration.FunctionArn' --output text)
          echo "LAMBDA_ARN=$LAMBDA_ARN" >> $GITHUB_ENV

      - name: Create API Gateway integration
        run: |
          INTEGRATION_ID=$(aws apigatewayv2 get-integrations \
            --api-id ${{ env.API_ID }} --region ${{ env.AWS_REGION }} \
            --query "Items[0].IntegrationId" --output text 2>/dev/null)

          if [ -z "$INTEGRATION_ID" ] || [ "$INTEGRATION_ID" = "None" ]; then
            INTEGRATION_ID=$(aws apigatewayv2 create-integration \
              --api-id ${{ env.API_ID }} \
              --integration-type AWS_PROXY \
              --integration-uri ${{ env.LAMBDA_ARN }} \
              --payload-format-version 2.0 \
              --region ${{ env.AWS_REGION }} \
              --query 'IntegrationId' --output text)
          fi
          echo "INTEGRATION_ID=$INTEGRATION_ID" >> $GITHUB_ENV

      - name: Create proxy route
        run: |
          ROUTE_EXISTS=$(aws apigatewayv2 get-routes \
            --api-id ${{ env.API_ID }} --region ${{ env.AWS_REGION }} \
            --query "Items[?RouteKey=='ANY /{proxy+}'].RouteId" --output text 2>/dev/null)

          if [ -z "$ROUTE_EXISTS" ] || [ "$ROUTE_EXISTS" = "None" ]; then
            aws apigatewayv2 create-route \
              --api-id ${{ env.API_ID }} \
              --route-key "ANY /{proxy+}" \
              --target "integrations/${{ env.INTEGRATION_ID }}" \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Create root ANY route
        run: |
          ROOT_ROUTE=$(aws apigatewayv2 get-routes \
            --api-id ${{ env.API_ID }} --region ${{ env.AWS_REGION }} \
            --query "Items[?RouteKey=='ANY /'].RouteId" --output text 2>/dev/null)

          if [ -z "$ROOT_ROUTE" ] || [ "$ROOT_ROUTE" = "None" ]; then
            aws apigatewayv2 create-route \
              --api-id ${{ env.API_ID }} \
              --route-key "ANY /" \
              --target "integrations/${{ env.INTEGRATION_ID }}" \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Create OPTIONS route for CORS
        run: |
          OPTIONS_ROUTE=$(aws apigatewayv2 get-routes \
            --api-id ${{ env.API_ID }} --region ${{ env.AWS_REGION }} \
            --query "Items[?RouteKey=='OPTIONS /{proxy+}'].RouteId" --output text 2>/dev/null)

          if [ -z "$OPTIONS_ROUTE" ] || [ "$OPTIONS_ROUTE" = "None" ]; then
            aws apigatewayv2 create-route \
              --api-id ${{ env.API_ID }} \
              --route-key "OPTIONS /{proxy+}" \
              --target "integrations/${{ env.INTEGRATION_ID }}" \
              --region ${{ env.AWS_REGION }}
          fi

      - name: Add Lambda permission for API Gateway
        run: |
          aws lambda add-permission \
            --function-name timetracker-api \
            --statement-id apigateway-invoke \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${{ env.AWS_REGION }}:*:${{ env.API_ID }}/*" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true

      - name: Deploy API Gateway stage
        run: |
          aws apigatewayv2 create-stage \
            --api-id ${{ env.API_ID }} \
            --stage-name prod \
            --auto-deploy \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws apigatewayv2 update-stage \
            --api-id ${{ env.API_ID }} \
            --stage-name prod \
            --auto-deploy \
            --region ${{ env.AWS_REGION }}

      - name: Output API URL
        run: |
          API_URL="https://${{ env.API_ID }}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "Backend API URL: $API_URL"

  # ───────────────────────────────────────────────
  # Job 3: Deploy frontend to S3 static hosting
  # ───────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API URL
        run: |
          API_ID=$(aws apigatewayv2 get-apis --region ${{ env.AWS_REGION }} \
            --query "Items[?Name=='timetracker-api'].ApiId" --output text)
          API_URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "Using API URL: $API_URL"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          CI: false

      - name: Create S3 bucket for frontend
        run: |
          aws s3api head-bucket --bucket timetracker-frontend-prod-goutham --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws s3api create-bucket \
            --bucket timetracker-frontend-prod-goutham \
            --region ${{ env.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}

      - name: Configure static website hosting
        run: |
          aws s3 website s3://timetracker-frontend-prod-goutham \
            --index-document index.html \
            --error-document index.html

      - name: Disable S3 block public access
        run: |
          aws s3api put-public-access-block \
            --bucket timetracker-frontend-prod-goutham \
            --public-access-block-configuration \
              BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false

      - name: Set S3 bucket policy for public read
        run: |
          aws s3api put-bucket-policy --bucket timetracker-frontend-prod-goutham --policy '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::timetracker-frontend-prod-goutham/*"
              }
            ]
          }'

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://timetracker-frontend-prod-goutham --delete

      - name: Output frontend URL
        run: |
          echo "Frontend URL: http://timetracker-frontend-prod-goutham.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
