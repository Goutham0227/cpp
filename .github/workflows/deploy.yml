name: CI/CD Pipeline - Freelancer Time Tracking & Invoice Generator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-1

jobs:
  # ───────────────────────────────────────────────
  # Job 1: Test the invoice_engine library
  # ───────────────────────────────────────────────
  test-library:
    name: Test Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install library and run tests
        run: |
          cd library
          pip install -e .
          pip install pytest
          pytest tests/ -v

  # ───────────────────────────────────────────────
  # Job 2: Deploy backend (Lambda + DynamoDB + S3 + SNS + API Gateway)
  # ───────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: test-library
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── DynamoDB ──
      - name: Create DynamoDB table
        run: |
          aws dynamodb describe-table --table-name timetracker-prod --region ${{ env.AWS_REGION }} > /dev/null 2>&1 || \
          aws dynamodb create-table \
            --table-name timetracker-prod \
            --attribute-definitions AttributeName=id,AttributeType=S \
            --key-schema AttributeName=id,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region ${{ env.AWS_REGION }}

      # ── S3 bucket for files ──
      - name: Create S3 bucket for files
        run: |
          aws s3api head-bucket --bucket timetracker-files-prod-goutham --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws s3api create-bucket \
            --bucket timetracker-files-prod-goutham \
            --region ${{ env.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}

      - name: Configure S3 CORS
        run: |
          aws s3api put-bucket-cors --bucket timetracker-files-prod-goutham --cors-configuration '{
            "CORSRules": [
              {
                "AllowedOrigins": ["*"],
                "AllowedMethods": ["GET", "PUT", "POST", "DELETE"],
                "AllowedHeaders": ["*"],
                "MaxAgeSeconds": 3600
              }
            ]
          }'

      # ── IAM role for Lambda ──
      - name: Create IAM role for Lambda
        run: |
          aws iam get-role --role-name timetracker-lambda-role > /dev/null 2>&1 || \
          aws iam create-role \
            --role-name timetracker-lambda-role \
            --assume-role-policy-document '{
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Principal": {"Service": "lambda.amazonaws.com"},
                  "Action": "sts:AssumeRole"
                }
              ]
            }'

      - name: Attach IAM policies
        run: |
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonDynamoDBFullAccess || true
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonS3FullAccess || true
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/AmazonSNSFullAccess || true
          aws iam attach-role-policy --role-name timetracker-lambda-role \
            --policy-arn arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole || true

      # ── SNS topic ──
      - name: Create SNS topic
        run: |
          SNS_TOPIC_ARN=$(aws sns create-topic --name timetracker-notifications --region ${{ env.AWS_REGION }} --query 'TopicArn' --output text)
          echo "SNS_TOPIC_ARN=$SNS_TOPIC_ARN" >> $GITHUB_ENV

      # ── Wait for IAM propagation ──
      - name: Wait for IAM propagation
        run: sleep 10

      # ── Package Lambda ──
      - name: Package Lambda function
        run: |
          cd backend
          pip install -r requirements.txt -t .
          zip -r ../function.zip . -x "*.pyc" -x "__pycache__/*" -x "package/*"

      # ── Get IAM role ARN ──
      - name: Get Lambda role ARN
        run: |
          ROLE_ARN=$(aws iam get-role --role-name timetracker-lambda-role --query 'Role.Arn' --output text)
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV

      # ── Deploy Lambda ──
      - name: Deploy Lambda function
        run: |
          if aws lambda get-function --function-name timetracker-api --region ${{ env.AWS_REGION }} > /dev/null 2>&1; then
            aws lambda update-function-code \
              --function-name timetracker-api \
              --zip-file fileb://function.zip \
              --region ${{ env.AWS_REGION }}
            aws lambda wait function-updated --function-name timetracker-api --region ${{ env.AWS_REGION }}
          else
            aws lambda create-function \
              --function-name timetracker-api \
              --runtime python3.11 \
              --handler lambda_function.lambda_handler \
              --role ${{ env.ROLE_ARN }} \
              --zip-file fileb://function.zip \
              --timeout 30 \
              --memory-size 256 \
              --region ${{ env.AWS_REGION }} \
              --environment Variables="{
                DYNAMODB_TABLE=timetracker-prod,
                S3_BUCKET=timetracker-files-prod-goutham,
                SNS_TOPIC_ARN=${{ env.SNS_TOPIC_ARN }},
                REGION=eu-west-1,
                JWT_SECRET=timetracker-secret-2026
              }"
          fi

      - name: Update Lambda environment variables
        run: |
          aws lambda update-function-configuration \
            --function-name timetracker-api \
            --environment Variables="{
              DYNAMODB_TABLE=timetracker-prod,
              S3_BUCKET=timetracker-files-prod-goutham,
              SNS_TOPIC_ARN=${{ env.SNS_TOPIC_ARN }},
              REGION=eu-west-1,
              JWT_SECRET=timetracker-secret-2026
            }" \
            --region ${{ env.AWS_REGION }} || true

      # ── API Gateway (REST API v1 - proven pattern) ──
      - name: Setup API Gateway
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='timetracker-api'].id" --output text --region ${{ env.AWS_REGION }})
          if [ -z "$API_ID" ] || [ "$API_ID" = "None" ]; then
            API_ID=$(aws apigateway create-rest-api --name timetracker-api --endpoint-configuration types=REGIONAL --query 'id' --output text --region ${{ env.AWS_REGION }})
          fi

          ROOT_ID=$(aws apigateway get-resources --rest-api-id $API_ID --query "items[?path=='/'].id" --output text --region ${{ env.AWS_REGION }})

          PROXY_ID=$(aws apigateway get-resources --rest-api-id $API_ID --query "items[?pathPart=='{proxy+}'].id" --output text --region ${{ env.AWS_REGION }})
          if [ -z "$PROXY_ID" ] || [ "$PROXY_ID" = "None" ]; then
            PROXY_ID=$(aws apigateway create-resource --rest-api-id $API_ID --parent-id $ROOT_ID --path-part '{proxy+}' --query 'id' --output text --region ${{ env.AWS_REGION }})
          fi

          LAMBDA_ARN=$(aws lambda get-function --function-name timetracker-api --query 'Configuration.FunctionArn' --output text --region ${{ env.AWS_REGION }})

          aws apigateway put-method --rest-api-id $API_ID --resource-id $PROXY_ID --http-method ANY --authorization-type NONE --request-parameters "method.request.path.proxy=true" --region ${{ env.AWS_REGION }} 2>/dev/null || true
          aws apigateway put-integration --rest-api-id $API_ID --resource-id $PROXY_ID --http-method ANY --type AWS_PROXY --integration-http-method POST --uri "arn:aws:apigateway:${{ env.AWS_REGION }}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations" --region ${{ env.AWS_REGION }}

          aws apigateway put-method --rest-api-id $API_ID --resource-id $PROXY_ID --http-method OPTIONS --authorization-type NONE --region ${{ env.AWS_REGION }} 2>/dev/null || true
          aws apigateway put-method-response --rest-api-id $API_ID --resource-id $PROXY_ID --http-method OPTIONS --status-code 200 --response-parameters "method.response.header.Access-Control-Allow-Headers=true,method.response.header.Access-Control-Allow-Methods=true,method.response.header.Access-Control-Allow-Origin=true" --region ${{ env.AWS_REGION }} 2>/dev/null || true
          aws apigateway put-integration --rest-api-id $API_ID --resource-id $PROXY_ID --http-method OPTIONS --type MOCK --request-templates '{"application/json": "{\"statusCode\": 200}"}' --region ${{ env.AWS_REGION }}
          aws apigateway put-integration-response --rest-api-id $API_ID --resource-id $PROXY_ID --http-method OPTIONS --status-code 200 --response-parameters '{"method.response.header.Access-Control-Allow-Headers":"'"'"'Content-Type,Authorization'"'"'","method.response.header.Access-Control-Allow-Methods":"'"'"'GET,POST,PUT,DELETE,OPTIONS'"'"'","method.response.header.Access-Control-Allow-Origin":"'"'"'*'"'"'"}' --region ${{ env.AWS_REGION }}

          aws apigateway put-method --rest-api-id $API_ID --resource-id $ROOT_ID --http-method ANY --authorization-type NONE --region ${{ env.AWS_REGION }} 2>/dev/null || true
          aws apigateway put-integration --rest-api-id $API_ID --resource-id $ROOT_ID --http-method ANY --type AWS_PROXY --integration-http-method POST --uri "arn:aws:apigateway:${{ env.AWS_REGION }}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations" --region ${{ env.AWS_REGION }}

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws lambda add-permission --function-name timetracker-api --statement-id apigateway-access-v1 --action lambda:InvokeFunction --principal apigateway.amazonaws.com --source-arn "arn:aws:execute-api:${{ env.AWS_REGION }}:${ACCOUNT_ID}:${API_ID}/*" --region ${{ env.AWS_REGION }} 2>/dev/null || true

          aws apigateway create-deployment --rest-api-id $API_ID --stage-name prod --region ${{ env.AWS_REGION }}

          echo "API_URL=https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod" >> $GITHUB_ENV

      - name: Output API URL
        run: echo "Backend API URL - $API_URL"

  # ───────────────────────────────────────────────
  # Job 3: Deploy frontend to S3 static hosting
  # ───────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get API URL
        run: |
          API_ID=$(aws apigateway get-rest-apis --query "items[?name=='timetracker-api'].id" --output text --region ${{ env.AWS_REGION }})
          API_URL="https://${API_ID}.execute-api.${{ env.AWS_REGION }}.amazonaws.com/prod"
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "Using API URL: $API_URL"

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ env.API_URL }}
          CI: false

      - name: Create S3 bucket for frontend
        run: |
          aws s3api head-bucket --bucket timetracker-frontend-prod-goutham --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws s3api create-bucket \
            --bucket timetracker-frontend-prod-goutham \
            --region ${{ env.AWS_REGION }} \
            --create-bucket-configuration LocationConstraint=${{ env.AWS_REGION }}

      - name: Configure static website hosting
        run: |
          aws s3 website s3://timetracker-frontend-prod-goutham \
            --index-document index.html \
            --error-document index.html

      - name: Disable S3 block public access
        run: |
          aws s3api put-public-access-block \
            --bucket timetracker-frontend-prod-goutham \
            --public-access-block-configuration \
              BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false

      - name: Set S3 bucket policy for public read
        run: |
          aws s3api put-bucket-policy --bucket timetracker-frontend-prod-goutham --policy '{
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicReadGetObject",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::timetracker-frontend-prod-goutham/*"
              }
            ]
          }'

      - name: Deploy to S3
        run: |
          aws s3 sync frontend/dist/ s3://timetracker-frontend-prod-goutham --delete

      - name: Output frontend URL
        run: |
          echo "Frontend URL: http://timetracker-frontend-prod-goutham.s3-website-${{ env.AWS_REGION }}.amazonaws.com"
